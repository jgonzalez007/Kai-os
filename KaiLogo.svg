<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="kaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="kaiGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#kaiGrad)"/>
  
  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Kai stylized K -->
  <g transform="translate(256,256)">
    <!-- Vertical stem -->
    <rect x="-40" y="-120" width="24" height="240" rx="12" fill="white"/>
    <!-- Top-right diagonal -->
    <rect x="-20" y="-100" width="160" height="24" rx="8" transform="rotate(50)" fill="white"/>
    <!-- Bottom-right diagonal -->
    <rect x="-20" y="76" width="160" height="24" rx="8" transform="rotate(-50)" fill="white"/>
    
    <!-- Pulse rings (representing AI awareness) -->
    <circle cx="40" cy="-40" r="16" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
    <circle cx="40" cy="-40" r="28" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
    <circle cx="40" cy="-40" r="40" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
  </g>
</svg>
